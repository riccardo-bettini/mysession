name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NPM Dependencies
        run: npm ci

      - name: Type Check & Svelte Check
        run: npm run check

      - name: Build Frontend
        run: npm run build

      - name: Run Core Rust Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Build Tauri Release Packages & Updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Assemble Release Assets & latest.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = $pkg.version
          New-Item -ItemType Directory -Path release_upload -Force | Out-Null
          
          # Copia installer e pacchetti generati
          Get-ChildItem -Path src-tauri\target\release\bundle -Recurse -File | Where-Object { $_.Extension -match 'exe|msi|zip|sig' } | ForEach-Object {
            Copy-Item $_.FullName -Destination release_upload\ -Force
          }
          
          # Standalone exe
          $standalone = "src-tauri\target\release\mysession.exe"
          if (Test-Path $standalone) {
            Copy-Item $standalone -Destination "release_upload\MySession_${version}_Standalone.exe" -Force
          }
          
          # Genera manifest latest.json
          $sig = Get-ChildItem -Path src-tauri\target\release\bundle -Recurse -Filter '*setup.exe.sig' | Select-Object -First 1
          $setupExe = Get-ChildItem -Path src-tauri\target\release\bundle -Recurse -Filter '*setup.exe' | Select-Object -First 1
          if ($sig -and $setupExe) {
            $sigContent = (Get-Content $sig.FullName -Raw).Trim()
            $isoDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            $manifest = @{
              version = $version
              notes = "MySession v${version} Release"
              pub_date = $isoDate
              platforms = @{
                "windows-x86_64" = @{
                  signature = $sigContent
                  url = "https://github.com/riccardobettini/mysession/releases/download/v${version}/$($setupExe.Name)"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "release_upload\latest.json" -Encoding UTF8
          }
          
          # Checksums
          $hashLines = @()
          Get-ChildItem release_upload -File | Where-Object { $_.Name -ne 'latest.json' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $hashLines += "$h  $($_.Name)"
          }
          $hashLines | Set-Content -Path "release_upload\SHA256SUMS-${version}.txt" -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_upload/*
          generate_release_notes: true
          draft: false
          prerelease: false
